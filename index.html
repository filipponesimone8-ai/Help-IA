  html, body {

    background: #0e1116;
    color: #eaeef5;

    overscroll-behavior: none;
  }
  .app {
    max-width: 640px;

    padding: 16px;

  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 18px;
    position: sticky; top: 0;
    background: rgba(14,17,22,0.95);
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  header h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.5px; }
  header h1 span { color: #4a9eff; }

  .crumbs {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    font-size: 13px; color: #8b93a1; margin-bottom: 14px;
    min-height: 20px;
  }
  .crumbs b { color: #4a9eff; font-weight: 600; }
  .crumbs span.sep { opacity: .5; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .card {
    background: linear-gradient(180deg, #1b2028 0%, #171d26 100%);
    border: 1px solid #232a35;
    border-radius: 16px;
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
    user-select: none;
  }
  .card:active { transform: scale(0.96); border-color: #4a9eff; }
  .card .emoji { font-size: 30px; display: block; margin-bottom: 8px; }
  .card .label { font-size: 14px; font-weight: 600; line-height: 1.25; }

  .back {
    background: transparent; border: 1px solid #232a35;
    color: #8b93a1; padding: 8px 14px; border-radius: 10px;
    font-size: 13px; margin-bottom: 14px; cursor: pointer;
  }

  .leaf-title🪛 {
    font-size: 17px;", prompt: " font-weight:proble 700; margin: 4px 0 12px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    background: #1b2028;
    color: #eaeef5;
    border: 1px solid #232a35;
    border-radius: 14px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #4a9eff; }

  .send {
    margin-top: 12px;
    width: 100%;
    background: #4a9eff;
    color: #fff;
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .send:disabled { opacity: .5; cursor: not-allowed; }

  .answer {
    margin-top: 16px;
    background: #131820;
    border: 1px solid #232a35;
    border-radius: 14px;
    padding: 16px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    display: none;
  }
  .answer.show { display: block; }
  .answer.loading { color: #8b93a1; font-style: italic; }
</style>

/* =========================================================
   STATO
   ========================================================= */
let currentPath = [];
let currentLeafPrompt = null;

const contentEl = document.getElementById("content");
const crumbsEl  = document.getElementById("crumbs");
const backBtn   = document.getElementById("backBtn");

/* =========================================================
   NAVIGAZIONE
   ========================================================= */
function getNodeAtPath(path) {
  let node = { children: TREE };
  for (const i of path) node = node.children[i];
  return node;
}

function render() {
  crumbsEl.innerHTML = "";
  contentEl.innerHTML = "";
  currentLeafPrompt = null;

  let crumbParts = ["Home"];
  let node = { children: TREE, label: "Home" };
  for (const i of currentPath) {
    node = node.children[i];
    crumbParts.push(node.label);
  }
  crumbsEl.innerHTML = crumbParts.map((p, idx) =>
    idx === crumbParts.length - 1
      ? `<b>${p}</b>`
      : `<span>${p}</span><span class="sep">›</span>`
  ).join(" ");

  backBtn.style.display = currentPath.length ? "block" : "none";

  const current = getNodeAtPath(currentPath);

  if (current.prompt) {
    currentLeafPrompt = current.prompt;
    renderLeaf(current);
    return;
  }

  const grid = document.createElement("div");
  grid.className = "grid";
  current.children.forEach((child, idx) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<span class="emoji">${child.emoji}</span><span class="label">${child.label}</span>`;
    card.onclick = () => {
      currentPath.push(idx);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    grid.appendChild(card);
  });
  contentEl.appendChild(grid);
}

function goBack() {
  if (currentPath.length) {
    currentPath.pop();
    render();
  }
}

/* =========================================================
   FOGLIA → INPUT + IA
   ========================================================= */
function renderLeaf(node) {
  const title = document.createElement("div");
  title.className = "leaf-title";
  title.textContent = `${node.emoji} ${node.label} — descrivi il tuo problema`;
  contentEl.appendChild(title);

  const ta = document.createElement("textarea");
  ta.placeholder = "Scrivi qui il tuo problema in dettaglio...";
  contentEl.appendChild(ta);

  const btn = document.createElement("button");
  btn.className = "send";
  btn.textContent = "Chiedi all'IA";
  contentEl.appendChild(btn);

  const ans = document.createElement("div");
  ans.className = "answer";
  contentEl.appendChild(ans);

  btn.onclick = async () => {
    const text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    btn.disabled = true;
    btn.textContent = "Sto pensando...";
    ans.className = "answer show loading";
    ans.textContent = "⏳ L'IA sta elaborando la risposta...";
    try {
      const reply = await askAI(currentLeafPrompt, text);
      ans.className = "answer show";
      ans.textContent = reply;
    } catch (e) {
      ans.className = "answer show";
      ans.textContent = "❌ Errore: " + e.message;
    }
    btn.disabled = false;
    btn.textContent = "Chiedi all'IA";
  };
}

/* =========================================================
   CHIAMATA ALLA NETLIFY FUNCTION
   ========================================================= */
async function askAI(context, userText) {
  let res, lastErr;

  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      res = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ context, userText })
      });
      if (res.ok) break;
      lastErr = await res.text();
      if (res.status >= 500 && attempt < 2) {
        await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
        continue;
      }
      break;
    } catch (e) {
      lastErr = e.message;
      if (attempt < 2) {
        await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
        continue;
      }
      throw new Error("Impossibile contattare il server: " + lastErr);
    }
  }

  if (!res || !res.ok) {
    throw new Error("Errore server (" + (res ? res.status : "?") + "): " + (lastErr || "").slice(0, 200));
  }

  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.reply || "Nessuna risposta ricevuta.";
}

/* =========================================================
   AVVIO
   ========================================================= */
